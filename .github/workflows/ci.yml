name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    # GitHub-hosted, ephemeral runner — fork PR code runs in a throwaway VM and
    # never touches the self-hosted release runner (which holds the Developer ID
    # signing keys). Public repos get free macOS runner minutes.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Select newest installed Xcode
        # The app icon is an Icon Composer document, so the build needs Xcode 26+.
        # Pick the highest-versioned Xcode on the runner image; fall back to default.
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$latest" ] && sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Drop the app icon for CI
        # The app icon is an Icon Composer (.icon) document; actool's renderer
        # crashes on the headless GitHub runner (no window server / GPU). The unit
        # tests don't need the icon, so remove it from this throwaway checkout and
        # blank the app-icon build setting below. The real icon still ships via the
        # self-hosted release build.
        run: rm -rf ClipRef/ClipRef.icon

      - name: Run tests
        run: |
          xcodebuild test \
            -project ClipRef.xcodeproj \
            -scheme ClipRef \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME=

  windows-test:
    name: Windows unit tests
    # GitHub-hosted, ephemeral Windows runner for the .NET port under windows/.
    # windows-latest is NTFS, so the [Trait("Category","Integration")] tests
    # (real Alternate Data Stream tagging + on-disk prune) run for real here.
    # No actions/setup-dotnet: the runner ships the .NET 8 SDK plus the Windows
    # Desktop pack that net8.0-windows + WindowsForms needs, mirroring how the
    # macOS job above uses the runner's preinstalled Xcode.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build (warnings as errors)
        run: dotnet build windows/ClipRef.sln -warnaserror

      - name: Run tests
        # --no-build reuses the warnings-as-errors build above; one run covers
        # the whole suite (unit + integration), like the macOS scheme run.
        run: dotnet test windows/ClipRef.sln --no-build
